# Render.com Blueprint — deploy at https://dashboard.render.com/blueprints
# Click "New +" → "Blueprint" → select heeku1/chat-bot → Apply
services:
  - type: web
    name: jimmy-chat-bot
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # --- Required secrets (fill in Render Dashboard after first deploy) ---
      - key: BOT_TOKEN
        sync: false
      # --- Production dashboard login ---
      - key: JIMMY_ADMIN_USERNAME
        sync: false
      - key: JIMMY_ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_ADMIN_USER_IDS
        sync: false
      # --- AI provider: fill at least one ---
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # --- Auto-generated on first deploy ---
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      # --- Set after first deploy: https://<your-service>.onrender.com ---
      - key: WEBHOOK_BASE_URL
        sync: false
      # Optional: enables the approved deploy action from Telegram
      - key: RENDER_DEPLOY_HOOK_URL
        sync: false
      # Ephemeral disk on free plan; state resets on redeploy
      - key: STATE_FILE
        value: /tmp/jimmy-bot-config.json
